name: Daily Briefing
run-name: ${{ inputs.recovery_slot != '' && format('Free recovery [{0}]', inputs.recovery_slot) || 'Daily Briefing' }}

on:
  schedule:
    # 매일 06:30 ~ 21:30 KST, 1시간 간격 (총 16회/일) = 매일 00:30~12:30, 21:30~23:30 UTC
    # Equivalent expressions re-register the native schedule without changing its hours.
    - cron: "30 21-23 * * *"
    - cron: "30 0-12 * * *"
  workflow_dispatch:
    inputs:
      refresh_comments:
        description: "AI 논평 6개 새로 생성 (체크 안 하면 캐시된 이전 논평 재사용, 무료)"
        type: boolean
        default: false
      recovery_slot:
        description: "무료 예약 누락 복구 전용 KST 슬롯 (자동 복구 helper가 설정)"
        type: string
        default: ""

permissions:
  contents: write

# Scheduled and manual refreshes must not push generated files simultaneously.
concurrency:
  group: daily-briefing-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-checks.txt

      - name: Check free recovery request
        env:
          RECOVERY_SLOT: ${{ inputs.recovery_slot }}
          RECOVERY_REFRESH_REQUESTED: ${{ inputs.refresh_comments }}
          RECOVERY_EVENT: ${{ github.event_name }}
        run: python scripts/free_refresh_recovery.py --validate-request

      - name: Check AI cache before free generation
        id: preflight
        run: >-
          python scripts/history_health.py preflight
          --snapshot "$RUNNER_TEMP/history-ai-before.json"
          --refresh-comments "${{ github.event_name == 'workflow_dispatch' && inputs.recovery_slot == '' && inputs.refresh_comments }}"

      - name: Install browser for clipboard checks
        run: python -m playwright install --with-deps chromium

      - name: Generate briefing
        id: generate
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
          RONE_KEY: ${{ secrets.RONE_KEY }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_slot == '' && inputs.refresh_comments && secrets.ANTHROPIC_API_KEY || '' }}
          REFRESH_COMMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_slot == '' && inputs.refresh_comments }}
        run: python scripts/generate_briefing.py

      - name: Validate historical matching and monthly prices
        id: history_content
        if: ${{ always() && steps.generate.outcome == 'success' }}
        continue-on-error: true
        env:
          HISTORY_REFRESH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_slot == '' && inputs.refresh_comments }}
        run: |
          args=(--html briefing.html --report reports/content.json --event "$GITHUB_EVENT_NAME" --started-at "${{ steps.preflight.outputs.started_at }}")
          if [ "$HISTORY_REFRESH_REQUESTED" != "true" ]; then
            args+=(--ai-before "$RUNNER_TEMP/history-ai-before.json")
          fi
          python scripts/verify_history_content.py "${args[@]}"

      - name: Check actual browser clipboard and both matching modes
        id: history_browser
        if: ${{ always() && steps.generate.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python scripts/check_history_browser.py
          --html briefing.html --report reports/browser.json
          --screenshot-dir reports/screenshots

      - name: Validate official transactions and reconstructed story
        id: housing_story
        if: ${{ always() && steps.generate.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python scripts/verify_housing_story.py
          --html briefing.html --report reports/story.json
          --started-at "${{ steps.preflight.outputs.started_at }}"

      - name: Require all checks before publication
        id: history_health
        if: ${{ always() }}
        run: python scripts/history_health.py finalize

      - name: Prepare verified story delivery manifest
        run: >-
          python scripts/story_delivery.py
          --html briefing.html --health history-health.json
          --output housing-story-delivery.json

      - name: Commit and push if changed
        id: publish
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefing.html index.html history-health.json housing-story-delivery.json
          [ ! -f article-links.json ] || git add article-links.json
          [ ! -f external-shortlinks.json ] || git add external-shortlinks.json
          [ ! -f news-source-audit.json ] || git add news-source-audit.json
          for f in fx-cache.json rone-cache.json comment-cache.json history-price-cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --quiet --cached || git commit -m "chore: update daily briefing ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
          python scripts/history_health.py deployment

      - name: Save automatic check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: history-validation-${{ github.run_id }}
          path: |
            reports/
            history-health.json
            housing-story-delivery.json
          if-no-files-found: warn
          retention-days: 14
